name: dotnet

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    name: Build & test engine (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # The cross-platform engine (M365Migrate.Core) and its tests build on Linux.
      # The WPF app (net8.0-windows) is built/published by a separate Windows job
      # once it lands.
      - name: Restore
        run: dotnet restore dotnet/tests/M365Migrate.Core.Tests/M365Migrate.Core.Tests.csproj

      - name: Test
        run: dotnet test dotnet/tests/M365Migrate.Core.Tests/M365Migrate.Core.Tests.csproj --configuration Release --no-restore

  app:
    name: Build & publish Windows app
    runs-on: windows-latest
    permissions:
      contents: write   # needed to publish the rolling release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # WPF (net8.0-windows) builds only on Windows. Publish a self-contained,
      # single-file executable that runs on a Windows machine with no prerequisites.
      - name: Publish single-file exe
        run: >
          dotnet publish dotnet/src/M365Migrate.App/M365Migrate.App.csproj
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: m365-migrate-windows
          path: publish/M365Migrate.exe
          if-no-files-found: error

      # On every push to main, attach the exe to a rolling "latest" release so it
      # has a permanent download URL (.../releases/latest).
      - name: Publish rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Windows build
          body: Automated build of the m365-migrate Windows app from the latest main.
          files: publish/M365Migrate.exe
