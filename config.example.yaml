# Example configuration for m365-migrate.
#
# Copy this file to `config.yaml` and fill in your tenant details.
# `config.yaml` is git-ignored so real credentials never get committed.
#
# Each tenant needs an Entra ID (Azure AD) app registration with the required
# application permissions (admin-consented). For the Users workload:
#   - Source tenant app:  User.Read.All        (read users)
#   - Target tenant app:  User.ReadWrite.All   (create/update users)
#
# Secrets are read from environment variables using the ${ENV:VAR_NAME} syntax
# so you can keep them out of the file entirely.

source:
  tenant_id: "00000000-0000-0000-0000-000000000000"
  client_id: "11111111-1111-1111-1111-111111111111"
  client_secret: "${ENV:SOURCE_CLIENT_SECRET}"
  # Primary verified domain of the source tenant (used for UPN rewriting).
  primary_domain: "contoso.onmicrosoft.com"

target:
  tenant_id: "22222222-2222-2222-2222-222222222222"
  client_id: "33333333-3333-3333-3333-333333333333"
  client_secret: "${ENV:TARGET_CLIENT_SECRET}"
  primary_domain: "fabrikam.onmicrosoft.com"

options:
  # When migrating users, rewrite UPNs/mail from the source domain to the
  # target domain (e.g. jane@contoso.onmicrosoft.com -> jane@fabrikam.onmicrosoft.com).
  rewrite_upn_domain: true
  # Skip users whose userType is "Guest".
  skip_guests: true
  # Directory for output artifacts (plans, mapping files, logs).
  output_dir: "out"
